<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Laboratorio de Casos · Panel del comité</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--negro:#1b1b1e;--carbon:#393e41;--gris:#747975;--gris-claro:#dfdede;--verde:#64c27b;--fondo:#f6fff8}
  *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--negro);background:#fff}
  header{background:var(--negro);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--verde)}
  h1{font-family:"Space Grotesk",Arial,sans-serif;font-weight:500;font-size:22px;margin:0}
  main{padding:24px}
  button{font:inherit;font-weight:600;border-radius:6px;padding:10px 18px;cursor:pointer;border:1px solid transparent}
  .primario{background:var(--verde);color:var(--negro)} .secundario{background:transparent;color:#fff;border-color:#666}
  .kpis{display:flex;gap:32px;margin:0 0 24px;flex-wrap:wrap}
  .kpis div b{display:block;font-family:"Space Grotesk",Arial,sans-serif;font-size:36px;font-weight:500}
  .kpis div span{font-size:13px;color:var(--gris)}
  .tabla{overflow:auto;border:1px solid var(--gris-claro);border-radius:6px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{background:var(--verde);color:var(--negro);text-align:left;padding:10px;white-space:nowrap;position:sticky;top:0}
  td{padding:10px;border-top:1px solid var(--gris-claro);vertical-align:top}
  select{font:inherit;padding:6px}
  .centro{max-width:480px;margin:80px auto;text-align:center}
  .oculto{display:none!important}
  .nota{color:var(--gris);font-size:13px}
</style>
</head>
<body>
<header>
  <h1><img src="img/gmc360-blanco.png" alt="GMC 360" style="height:28px;vertical-align:middle;margin-right:12px"><img src="img/cnt.png" alt="CNT" style="height:40px;vertical-align:middle;margin-right:16px">Panel del comité</h1>
  <div>
    <button class="primario oculto" id="excel">Descargar Excel</button>
    <button class="secundario oculto" id="salir">Salir</button>
  </div>
</header>
<main>
  <div class="centro" id="entrar">
    <p>Acceso sólo para el comité GMC 360 · CNT.</p>
    <button class="primario" id="login">Entrar con Google</button>
    <p class="nota" id="msg"></p>
  </div>
  <div id="panel" class="oculto">
    <div class="kpis" id="kpis"></div>
    <div class="tabla"><table id="tabla"></table></div>
    <p class="nota">El estatus se guarda al cambiarlo. «Preferente» se confirma contra la fecha de recepción (antes del 15-oct-2026).</p>
  </div>
</main>
<script type="module">
import { firebaseConfig, administradores } from "./config.js";
import { secciones } from "./preguntas.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const preguntas = secciones.flatMap(s => s.preguntas);
const ESTATUS = ["recibida", "en revisión", "aceptada", "lista de espera", "no seleccionada", "pagada"];
let filas = [];

$("login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $("msg").textContent = e.message);
$("salir").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  const ok = user && administradores.includes(user.email);
  $("entrar").classList.toggle("oculto", ok);
  $("panel").classList.toggle("oculto", !ok);
  $("excel").classList.toggle("oculto", !ok);
  $("salir").classList.toggle("oculto", !user);
  if (user && !ok) $("msg").textContent = `${user.email} no está autorizado.`;
  if (ok) await carga();
});

const fecha = ts => ts?.toDate ? ts.toDate() : null;
const plano = v => Array.isArray(v) ? v.join("; ") : v === true ? "Sí" : v === false ? "No" : (v ?? "");

async function carga() {
  const snap = await getDocs(query(collection(db, "solicitudes"), orderBy("creada", "asc")));
  filas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const cuenta = e => filas.filter(f => f.estatus === e).length;
  $("kpis").innerHTML = [["Solicitudes", filas.length], ["Aceptadas", cuenta("aceptada")], ["En lista de espera", cuenta("lista de espera")], ["Pagadas", cuenta("pagada")]]
    .map(([t, n]) => `<div><b>${n}</b><span>${t}</span></div>`).join("");
  const cols = ["Recibida", "Estatus", "Nombre", "Institución", "Cargo", "Sector", "Experiencia", "Correo", "WhatsApp"];
  $("tabla").innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>` + filas.map(f => `<tr>
    <td>${fecha(f.creada)?.toLocaleString("es-MX") ?? ""}</td>
    <td><select data-id="${f.id}">${ESTATUS.map(e => `<option ${e === f.estatus ? "selected" : ""}>${e}</option>`).join("")}</select></td>
    <td>${f.p1_nombre}</td><td>${f.p5_institucion}</td><td>${f.p6_cargo}</td><td>${f.p7_sector}</td><td>${f.p9_experiencia}</td>
    <td>${f.p2_correo}</td><td>${f.p3_whatsapp}</td></tr>`).join("");
  document.querySelectorAll("select[data-id]").forEach(s => s.onchange = async () => {
    await updateDoc(doc(db, "solicitudes", s.dataset.id), { estatus: s.value });
    filas.find(f => f.id === s.dataset.id).estatus = s.value;
  });
}

$("excel").onclick = async () => {
  const XLSX = await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs");
  const datos = filas.map(f => {
    const r = { "Recibida": fecha(f.creada), "Estatus": f.estatus, "Preferente (antes 15-oct)": fecha(f.creada) ? (fecha(f.creada) < new Date("2026-10-15T00:00:00-06:00") ? "Sí" : "No") : "" };
    preguntas.forEach(q => { r[q.texto.replace("{plazoPago}", "5").slice(0, 80)] = plano(f[q.id]); });
    return r;
  });
  const ws = XLSX.utils.json_to_sheet(datos, { cellDates: true });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Solicitudes");
  XLSX.writeFile(wb, `Laboratorio_Solicitudes_${new Date().toISOString().slice(0, 10)}.xlsx`);
};
</script>
</body>
</html>
